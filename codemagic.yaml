# ドライブ移行 (drive-bridge) のビルド設定。
# 映画棚で実績のある形と同じ:リポジトリには android フォルダを入れず、
# ビルド時に flutter create で生成してから APK を作る。
workflows:
  android-workflow:
    name: Android APK

    environment:
      flutter: stable
      android_signing:
        - drive_bridge_keystore

    scripts:
      - name: Create Android project
        script: |
          set -e
          echo "=== Creating Android project ==="
          flutter create --platforms=android .
          echo "=== Checking Android directory ==="
          test -d android
          ls -la android

      - name: Set up fixed-keystore signing
        script: |
          set -e
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          python3 - <<'PYEOF'
          import os
          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"
          if os.path.exists(kts):
              s = open(kts).read()
              assert "buildTypes {" in s, "buildTypes block not found in build.gradle.kts"
              imps = ""
              if "import java.util.Properties" not in s:
                  imps += "import java.util.Properties\n"
              if "import java.io.FileInputStream" not in s:
                  imps += "import java.io.FileInputStream\n"
              if imps:
                  s = imps + s
              if "keystoreProperties" not in s:
                  load_snippet = (
                      "val keystoreProperties = Properties()\n"
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      "if (keystorePropertiesFile.exists()) {\n"
                      "    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                      "}\n\n"
                  )
                  idx = s.index("android {")
                  s = s[:idx] + load_snippet + s[idx:]
              block = (
                  "    signingConfigs {\n"
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                  '            storePassword = keystoreProperties["storePassword"] as String\n'
                  "        }\n"
                  "    }\n\n"
              )
              if 'create("release")' not in s:
                  s = s.replace("buildTypes {", block + "    buildTypes {", 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
              if "debug {" not in s:
                  s = s.replace(
                      "buildTypes {",
                      'buildTypes {\n        debug {\n            signingConfig = signingConfigs.getByName("release")\n        }',
                      1,
                  )
              open(kts, "w").write(s)
              print("patched build.gradle.kts: fixed keystore signing for debug+release")
          elif os.path.exists(groovy):
              s = open(groovy).read()
              assert "buildTypes {" in s, "buildTypes block not found in build.gradle"
              block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            def kp = new Properties()\n"
                  '            def kpf = rootProject.file("key.properties")\n'
                  "            if (kpf.exists()) { kpf.withInputStream { kp.load(it) } }\n"
                  "            keyAlias kp['keyAlias']\n"
                  "            keyPassword kp['keyPassword']\n"
                  "            storeFile file(kp['storeFile'])\n"
                  "            storePassword kp['storePassword']\n"
                  "        }\n"
                  "    }\n\n"
              )
              if "signingConfigs" not in s:
                  s = s.replace("buildTypes {", block + "    buildTypes {", 1)
              s = s.replace("signingConfig signingConfigs.debug",
                            "signingConfig signingConfigs.release")
              if "debug {" not in s:
                  s = s.replace(
                      "buildTypes {",
                      "buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }",
                      1,
                  )
              open(groovy, "w").write(s)
              print("patched build.gradle: fixed keystore signing for debug+release")
          else:
              raise SystemExit("no android/app build.gradle(.kts) found")
          PYEOF

      - name: Apply app patches (storage bridge and manifest permissions)
        script: |
          set -e
          python3 - <<'PYEOF'
          import os
          # 1) MainActivity.kt を、ストレージ許可の橋渡し入りに差し替える。
          #    ダウンロード監視には「すべてのファイルへのアクセス」許可が要る。
          kt_dir = "android/app/src/main/kotlin/com/example/drive_bridge"
          os.makedirs(kt_dir, exist_ok=True)
          main_activity = '''package com.example.drive_bridge

          import android.content.Intent
          import android.net.Uri
          import android.os.Environment
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "drive_bridge/storage")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "isAllFilesAccessGranted" ->
                                  result.success(Environment.isExternalStorageManager())
                              "openDrive" -> {
                                  var opened = false
                                  try {
                                      val launch = packageManager.getLaunchIntentForPackage("com.google.android.apps.docs")
                                      if (launch != null) {
                                          startActivity(launch)
                                          opened = true
                                      }
                                  } catch (e: Exception) {
                                      // ドライブアプリが無い等。ブラウザで開く。
                                  }
                                  if (!opened) {
                                      try {
                                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://drive.google.com/drive/my-drive")))
                                      } catch (e: Exception) {
                                          // 開けない環境では何もしない
                                      }
                                  }
                                  result.success(null)
                              }
                              "openChrome" -> {
                                  var opened = false
                                  try {
                                      val launch = packageManager.getLaunchIntentForPackage("com.android.chrome")
                                      if (launch != null) {
                                          startActivity(launch)
                                          opened = true
                                      }
                                  } catch (e: Exception) {
                                      // Chrome が無い等。ブラウザで Google を開く。
                                  }
                                  if (!opened) {
                                      try {
                                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com")))
                                      } catch (e: Exception) {
                                          // 開けない環境では何もしない
                                      }
                                  }
                                  result.success(null)
                              }
                              "openMuse" -> {
                                  var opened = false
                                  try {
                                      val launch = packageManager.getLaunchIntentForPackage("com.facebook.aura")
                                      if (launch != null) {
                                          startActivity(launch)
                                          opened = true
                                      }
                                  } catch (e: Exception) {
                                      // Muse アプリが無い等。Play ストアへ誘導する。
                                  }
                                  if (!opened) {
                                      try {
                                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=com.facebook.aura")))
                                      } catch (e: Exception) {
                                          // 開けない環境では何もしない
                                      }
                                  }
                                  result.success(null)
                              }
                              "openAllFilesAccessSettings" -> {
                                  try {
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                      intent.data = Uri.parse("package:" + packageName)
                                      startActivity(intent)
                                  } catch (e: Exception) {
                                      try {
                                          startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                                      } catch (e2: Exception) {
                                          // 開けない環境では何もしない
                                      }
                                  }
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          '''
          open(os.path.join(kt_dir, "MainActivity.kt"), "w").write(main_activity)
          print("wrote MainActivity.kt with storage bridge")
          # 2) AndroidManifest.xml に権限を追加する(重複は入れない)。
          manifest = "android/app/src/main/AndroidManifest.xml"
          s = open(manifest).read()
          perms = ""
          if "android.permission.INTERNET" not in s:
              perms += '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if "android.permission.MANAGE_EXTERNAL_STORAGE" not in s:
              perms += '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
          if perms:
              idx = s.index(">", s.index("<manifest")) + 1
              s = s[:idx] + "\n" + perms + s[idx:]
              open(manifest, "w").write(s)
          print("patched AndroidManifest.xml permissions")
          PYEOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
